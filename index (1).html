<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alumni Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1f2a37;--mut:#6b7280;--acc:#1d4e5f;--acc2:#c8793a;--line:#e7e1d6;--chip:#eef3f4;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#13191d;--card:#1b2329;--ink:#eef1f3;--mut:#9aa6b0;--acc:#6fb4c8;--acc2:#e09a5f;--line:#2b363e;--chip:#25323a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
header{padding:48px 20px 28px;text-align:center;max-width:860px;margin:auto}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0}h1{font-size:clamp(2rem,6vw,3rem)}
header p{color:var(--mut);max-width:560px;margin:12px auto 0}
nav{display:flex;gap:6px;justify-content:center;margin-top:22px;flex-wrap:wrap}
nav a,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 18px;border-radius:99px;text-decoration:none;cursor:pointer;font:inherit;font-weight:500}
nav a.on,.btn.p{background:var(--acc);color:var(--bg);border-color:var(--acc)}
main{max-width:980px;margin:auto;padding:0 20px 120px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 22px}
.chip{border:1px solid var(--line);background:var(--chip);padding:5px 13px;border-radius:99px;font-size:.85rem;cursor:pointer;color:var(--ink);font-family:inherit}
.chip.on{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.date{color:var(--acc2);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.card h3{margin:0;font-family:Fraunces,serif;font-size:1.2rem}.mut{color:var(--mut);font-size:.9rem}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tags span{background:var(--chip);border-radius:99px;padding:2px 10px;font-size:.75rem;color:var(--acc)}
.card .btn{margin-top:auto;align-self:flex-start}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px;background:var(--card);border-top:1px solid var(--line);display:none;justify-content:space-between;align-items:center;gap:12px;z-index:5}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);max-width:480px;width:92%;padding:24px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:.85rem;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.empty{color:var(--mut);padding:30px;text-align:center}
.hp{position:absolute;left:-9999px}
</style></head><body>
<header><h1>Alumni Hub</h1><p>Find events, meet our student organizations, and tell us how you’d like to give back.</p>
<nav><a href="#events" id="n-events">Events</a><a href="#orgs" id="n-orgs">Student Organizations</a></nav></header>
<main id="main"></main>
<div id="bar"><span id="cnt"></span><button class="btn p" id="go">Review &amp; RSVP</button></div>
<dialog id="dlg"></dialog>
<script>
/* ====== PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BETWEEN THE QUOTES ====== */
const API_URL = "https://script.google.com/macros/s/AKfycbwtWRvSsGQ7DjqqeilLiAPcavhyuFsQ5QHSbz78Bf1-sFCMnRXf6UAAjO4hgnuHB359zw/exec";
/* ========================================================================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let events=[],orgs=[],cart=new Set(),filter=new Set(),state='loading';
const parse=d=>{const t=Date.parse(d);return isNaN(t)?null:t};
const fmt=d=>{const t=parse(d);return t===null?d:new Date(t).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})};
const tagsOf=e=>(e.Tags||'').split(',').map(t=>t.trim()).filter(Boolean);
const view=()=>location.hash==='#orgs'?'orgs':'events';
function render(){
  const v=view();$('#n-events').classList.toggle('on',v==='events');$('#n-orgs').classList.toggle('on',v==='orgs');
  $('#main').innerHTML=state==='loading'?'<div class="empty">Loading…</div>':state==='noapi'?'<div class="empty">Setup needed: add your Apps Script URL to <code>API_URL</code> in index.html.</div>':state==='error'?'<div class="empty">We couldn’t load the page content. Please refresh and try again.</div>':v==='events'?evView():orgView();
  const n=cart.size;$('#bar').style.display=n&&v==='events'?'flex':'none';$('#cnt').textContent=n+' event'+(n>1?'s':'')+' selected';
}
function evView(){
  const today=new Date().setHours(0,0,0,0);
  const up=events.filter(e=>{const t=parse(e.Date);return t===null||t>=today});
  const all=[...new Set(up.flatMap(tagsOf))].sort();
  const list=up.filter(e=>!filter.size||tagsOf(e).some(t=>filter.has(t))).sort((a,b)=>(parse(a.Date)||0)-(parse(b.Date)||0));
  return `<div class="chips">${all.map(t=>`<button class="chip ${filter.has(t)?'on':''}" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}${filter.size?'<button class="chip" data-tag="">Clear</button>':''}</div>`+
  (list.length?`<div class="grid">${list.map(e=>`<div class="card ${cart.has(e.row)?'sel':''}"><div class="date">${esc(fmt(e.Date))}${e.Time?' · '+esc(e.Time):''}</div><h3>${esc(e.Title)}</h3><div class="mut">${esc(e.Location)}</div><div>${esc(e.Description)}</div><div class="tags">${tagsOf(e).map(t=>`<span>${esc(t)}</span>`).join('')}</div><button class="btn ${cart.has(e.row)?'p':''}" data-add="${e.row}">${cart.has(e.row)?'✓ Added':'Add to my list'}</button></div>`).join('')}</div>`:'<div class="empty">No upcoming events yet. Check back soon!</div>');
}
function orgView(){
  return orgs.length?`<div class="grid">${[...orgs].sort((a,b)=>(a.Name||'').localeCompare(b.Name||'')).map(o=>`<div class="card"><h3>${esc(o.Name)}</h3><div>${esc(o.Description)}</div><div class="mut">${o['Contact Person']?'Contact: '+esc(o['Contact Person'])+'<br>':''}${o['Contact Email']?`<a href="mailto:${esc(o['Contact Email'])}" style="color:var(--acc)">${esc(o['Contact Email'])}</a><br>`:''}${/^https?:\/\//.test(o.Website||'')?`<a href="${esc(o.Website)}" target="_blank" rel="noopener" style="color:var(--acc)">Website</a>`:''}</div></div>`).join('')}</div>`:'<div class="empty">No organizations listed yet.</div>';
}
function checkout(){
  const d=$('#dlg'),chosen=events.filter(e=>cart.has(e.row));
  d.innerHTML=`<h2>Your RSVP</h2><ul>${chosen.map(e=>`<li>${esc(e.Title)} <span class="mut">(${esc(fmt(e.Date))})</span></li>`).join('')}</ul>
  <label>Full name</label><input id="f-name" autocomplete="name"><label>Email</label><input id="f-email" type="email" autocomplete="email"><label>Graduation year</label><input id="f-year"><label>Anything we should know?</label><textarea id="f-notes" rows="3"></textarea>
  <input class="hp" id="f-web" tabindex="-1" autocomplete="off" aria-hidden="true">
  <div class="row"><button class="btn p" id="sub">Submit RSVP</button><button class="btn" id="cx">Back</button></div><p class="mut" id="msg"></p>`;
  d.showModal();$('#cx').onclick=()=>d.close();
  $('#sub').onclick=async()=>{
    const name=$('#f-name').value.trim(),email=$('#f-email').value.trim();
    if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){$('#msg').textContent='Please enter your name and a valid email.';return}
    $('#sub').disabled=true;$('#msg').textContent='Sending…';
    try{
      await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({name,email,year:$('#f-year').value,notes:$('#f-notes').value,website:$('#f-web').value,eventRows:chosen.map(e=>e.row)})});
      d.innerHTML='<h2>Thank you!</h2><p>Your RSVP was sent. Check your email for a confirmation.</p><div class="row"><button class="btn p" id="cx">Close</button></div>';
      $('#cx').onclick=()=>d.close();cart.clear();render();
    }catch(e){$('#sub').disabled=false;$('#msg').textContent='Something went wrong. Please check your connection and try again.'}
  };
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tag],[data-add],#go');if(!t)return;
  if(t.dataset.tag!==undefined){t.dataset.tag?(filter.has(t.dataset.tag)?filter.delete(t.dataset.tag):filter.add(t.dataset.tag)):filter.clear();render()}
  else if(t.dataset.add){const r=+t.dataset.add;cart.has(r)?cart.delete(r):cart.add(r);render()}
  else checkout();
});
addEventListener('hashchange',render);
(async()=>{
  if(!API_URL){state='noapi';return render()}
  render();
  try{const r=await fetch(API_URL);const j=await r.json();events=j.events||[];orgs=j.orgs||[];state='ok'}catch(e){state='error'}
  render();
})();
</script></body></html>
